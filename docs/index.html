<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CO5420 Air Quality Forecasting project">
  <title>Air Quality Forecasting | CO5420</title>
  <style>
    :root { color-scheme: light; --ink: #17252a; --muted: #5b6b70; --paper: #f5f1e8; --card: #fffdf8; --accent: #d85b3f; --line: #d9d2c4; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.6 Georgia, serif; }
    main { max-width: 980px; margin: 0 auto; padding: 4rem 1.25rem; }
    .eyebrow { color: var(--accent); font: 700 .75rem/1.2 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 720px; margin: .6rem 0 1rem; font: 700 clamp(2.8rem, 8vw, 6.5rem)/.95 Georgia, serif; letter-spacing: 0; }
    .intro { max-width: 620px; color: var(--muted); font-size: 1.2rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 2rem 0 4rem; }
    a { color: inherit; }
    .button { display: inline-block; padding: .65rem 1rem; border: 1px solid var(--ink); color: var(--card); background: var(--ink); font: 700 .9rem system-ui, sans-serif; text-decoration: none; }
    .button.secondary { color: var(--ink); background: transparent; }
    section { border-top: 1px solid var(--line); padding-top: 1.25rem; margin-top: 2rem; }
    h2 { margin: 0 0 1rem; font: 700 1.6rem/1.2 Georgia, serif; }
    .team { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
    .member { min-height: 150px; padding: 1.2rem; background: var(--card); }
    .member strong { display: block; margin-bottom: .25rem; font-size: 1.05rem; }
    .member small { display: block; color: var(--muted); }
    .member a { display: inline-block; margin-top: .8rem; color: var(--accent); font: 700 .8rem system-ui, sans-serif; text-decoration: none; }
    .tags { color: var(--muted); font: .9rem system-ui, sans-serif; }
    footer { margin-top: 4rem; color: var(--muted); font: .8rem system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">CO5420 · cepdnaclk</div>
    <h1 id="title">Air Quality Forecasting</h1>
    <p class="intro" id="description">Loading project information...</p>
    <div class="actions">
      <a class="button" id="repository" href="https://github.com/cepdnaclk/CO5420_Air_Quality_Forecasting">View repository</a>
      <a class="button secondary" href="https://people.ce.pdn.ac.lk/">Department profiles</a>
    </div>
    <section>
      <h2>Team</h2>
      <div class="team" id="team" aria-live="polite"></div>
    </section>
    <section>
      <h2>Focus</h2>
      <p class="tags" id="tags"></p>
    </section>
    <footer>Department of Computer Engineering · University of Peradeniya</footer>
  </main>
  <script>
    fetch('data/index.json')
      .then(response => response.json())
      .then(project => {
        document.title = `${project.title} | CO5420`;
        document.querySelector('#title').textContent = project.title;
        document.querySelector('#description').textContent = project.description;
        document.querySelector('#repository').href = project.repository;
        document.querySelector('#tags').textContent = project.tags.join(' · ');
        document.querySelector('#team').innerHTML = project.team.map(member => `
          <article class="member">
            <strong>${member.name}</strong>
            <small>${member.eNumber}</small>
            <a href="${member.profile_url}">View profile →</a>
          </article>`).join('');
      })
      .catch(() => { document.querySelector('#description').textContent = 'Project data could not be loaded.'; });
  </script>
</body>
</html>
